[package]
name = "shy-dwarf"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "shy-dwarf"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
gimli = { version = "0.32.3", features = ["write"] }
object = { version = "0.37.3", features = ["write"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

